<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main background gradient - deep dark with subtle blue tint -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#06090d"/>
    </linearGradient>

    <!-- Green glow gradient for profit bar -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#00c853"/>
    </linearGradient>

    <!-- Red gradient for loss bar -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5252"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>

    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#69ffb0"/>
    </linearGradient>

    <!-- Glow filter for green elements -->
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for bg ring -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines (very faint) -->
  <g opacity="0.06" stroke="#00e676" stroke-width="1">
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="352" x2="512" y2="352"/>
    <line x1="128" y1="80" x2="128" y2="512"/>
    <line x1="256" y1="80" x2="256" y2="512"/>
    <line x1="384" y1="80" x2="384" y2="512"/>
  </g>

  <!-- Glowing ring accent -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#00e676" stroke-width="0.8" opacity="0.07"/>

  <!-- ── CANDLESTICK BARS ── -->
  <!-- Bar 1 (leftmost) - small loss -->
  <g filter="url(#shadow)">
    <!-- wick -->
    <line x1="136" y1="218" x2="136" y2="330" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <rect x="122" y="240" width="28" height="62" rx="5" fill="url(#redGrad)" opacity="0.9"/>
  </g>

  <!-- Bar 2 - medium profit -->
  <g filter="url(#shadow)">
    <line x1="204" y1="195" x2="204" y2="320" stroke="#00e676" stroke-width="3" stroke-linecap="round"/>
    <rect x="190" y="215" width="28" height="78" rx="5" fill="url(#greenGrad)" opacity="0.95"/>
  </g>

  <!-- Bar 3 - small loss -->
  <g filter="url(#shadow)">
    <line x1="272" y1="228" x2="272" y2="318" stroke="#ff5252" stroke-width="3" stroke-linecap="round"/>
    <rect x="258" y="248" width="28" height="48" rx="5" fill="url(#redGrad)" opacity="0.85"/>
  </g>

  <!-- Bar 4 (rightmost) - big profit, tallest, glowing -->
  <g filter="url(#greenGlow)">
    <line x1="340" y1="160" x2="340" y2="315" stroke="#00e676" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="326" y="180" width="28" height="108" rx="5" fill="url(#greenGrad)"/>
    <!-- Extra inner glow on tall bar -->
    <rect x="326" y="180" width="28" height="108" rx="5" fill="none" stroke="#69ffb0" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ── TREND ARROW ── -->
  <!-- Arrow path going up-right across all bars -->
  <g filter="url(#greenGlow)" opacity="0.9">
    <!-- Arrow line -->
    <polyline
      points="110,320 180,275 248,290 318,225 385,155"
      fill="none"
      stroke="url(#arrowGrad)"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-dasharray="none"
    />
    <!-- Arrowhead -->
    <polygon
      points="385,155 362,162 372,183"
      fill="#69ffb0"
    />
  </g>

  <!-- ── SPARKLE DOTS ── small decorative highlights -->
  <circle cx="385" cy="155" r="5" fill="#fff" opacity="0.9" filter="url(#greenGlow)"/>
  <circle cx="110" cy="320" r="3" fill="#00e676" opacity="0.5"/>

  <!-- Subtle bottom fade overlay for depth -->
  <rect x="0" y="380" width="512" height="132" rx="0" fill="url(#bgGrad)" opacity="0.35" clip-path="url(#roundedClip)"/>

  <!-- Bottom border accent line -->
  <line x1="80" y1="395" x2="432" y2="395" stroke="#00e676" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
</svg>
